<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tangkap Makanan Sihat</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#e8f5e9;
    margin:0;
    padding:20px;
}

h1{
    color:#2e7d32;
}

#game{
    width:500px;
    height:600px;
    margin:auto;
    border:3px solid #2e7d32;
    background:white;
    position:relative;
    overflow:hidden;
}

#player{
    position:absolute;
    bottom:10px;
    left:220px;
    font-size:50px;
}

.item{
    position:absolute;
    font-size:35px;
}

#score{
    font-size:24px;
    font-weight:bold;
    margin:15px;
}
</style>
</head>

<body>

<h1>🩺 Tangkap Makanan Sihat</h1>

<div id="score">
Skor: <span id="markah">0</span>
</div>

<div id="game">
    <div id="player">🧑</div>
</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const markahText = document.getElementById("markah");

let score = 0;
let playerX = 220;

const sihat = ["🍎","🥦","🐟","🥗"];
const tidakSihat = ["🍩","🍬","🥤","🎂"];

document.addEventListener("keydown", function(e){

    if(e.key==="ArrowLeft"){
        playerX -= 25;
    }

    if(e.key==="ArrowRight"){
        playerX += 25;
    }

    if(playerX < 0) playerX = 0;
    if(playerX > 450) playerX = 450;

    player.style.left = playerX + "px";
});

function ciptaMakanan(){

    const item = document.createElement("div");
    item.className = "item";

    const baik = Math.random() > 0.5;

    if(baik){
        item.innerHTML = sihat[Math.floor(Math.random()*sihat.length)];
    }else{
        item.innerHTML = tidakSihat[Math.floor(Math.random()*tidakSihat.length)];
    }

    item.dataset.baik = baik;

    let x = Math.random()*450;
    let y = 0;

    item.style.left = x + "px";
    item.style.top = y + "px";

    game.appendChild(item);

    const jatuh = setInterval(function(){

        y += 5;
        item.style.top = y + "px";

        const itemRect = item.getBoundingClientRect();
        const playerRect = player.getBoundingClientRect();

        if(
            itemRect.left < playerRect.right &&
            itemRect.right > playerRect.left &&
            itemRect.top < playerRect.bottom &&
            itemRect.bottom > playerRect.top
        ){

            if(item.dataset.baik === "true"){
                score += 10;
            }else{
                score -= 10;
            }

            markahText.textContent = score;

            clearInterval(jatuh);
            item.remove();
        }

        if(y > 580){
            clearInterval(jatuh);
            item.remove();
        }

    },30);
}

setInterval(ciptaMakanan,1000);

</script>

</body>
</html>
